<title>PALS 개인정보처리방침</title>
<h1>PALS 개인정보처리방침</h1>
<p>PALS는 개발자 본인만 사용하는 개인용 앱입니다.</p>
<ul>
<li>구글 캘린더는 읽기만 하며, PALS가 직접 만든 "PALS" 캘린더에만 일정을 씁니다.</li>
<li>가져온 정보는 사용자 본인의 PC에만 저장되고, 다른 사람이나 회사에 보내거나 팔지 않습니다.</li>
<li>구글 계정 설정에서 언제든 PALS의 접근 권한을 해제할 수 있습니다.</li>
</ul>
